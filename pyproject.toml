[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent"
version = "0.1.0"
description = "Local portfolio research and stock analysis agent"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "alembic",
    "build",
    "dist",
]

[tool.pylint.main]
source-roots = ["src"]
init-hook = "import sys; sys.path.insert(0, 'src')"
ignore-paths = ["^alembic/.*", "^.venv/.*"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
    "duplicate-code",
    "logging-fstring-interpolation",
    "broad-exception-caught",
    "broad-exception-raised",
    "redefined-outer-name",
    "unused-argument",
    "import-outside-toplevel",
    "fixme",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "db", "app", "logger", "e", "f", "v", "kpi", "df", "SessionLocal"]
