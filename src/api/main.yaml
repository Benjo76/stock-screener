openapi: 3.1.0
info:
  title: Stock Screener API
  description: Stock Screener REST API with authentication, portfolio management,
    CSV import, and fundamental analysis.
  version: 0.1.0
paths:
  /healthcheck:
    get:
      tags:
      - System
      summary: Healthcheck
      description: Returns the operational status of the service.
      operationId: healthcheck_healthcheck_get
      responses:
        '200':
          description: Service is healthy and running
          content:
            application/json:
              schema: {}
              example:
                status: ok
                service: stock-agent
  /healthcheck/db:
    get:
      tags:
      - System
      summary: Database Healthcheck
      description: Verifies the database connection by executing a test query.
      operationId: database_healthcheck_healthcheck_db_get
      responses:
        '200':
          description: Database is connected and reachable
          content:
            application/json:
              schema: {}
              example:
                status: ok
                database: connected
  /stocks:
    get:
      tags:
      - Stocks
      summary: List and search stocks
      description: Retrieve a list of stored stocks, optionally filtered by ISIN,
        WKN, Ticker, or Name.
      operationId: list_stocks_stocks_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term for ISIN, WKN, Ticker or Name
          title: Query
        description: Search term for ISIN, WKN, Ticker or Name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: List of stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockRead'
                title: Response List Stocks Stocks Get
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Stocks
      summary: Create or retrieve a stock
      description: Registers a new stock or returns an existing one if the ISIN, WKN,
        or Ticker is already present. Attempts to automatically enrich stock metadata
        via the active data provider.
      operationId: create_stock_stocks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCreate'
      responses:
        '201':
          description: Stock created or retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRead'
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '415':
          description: Unsupported Media Type - Content-Type must be application/json
          content:
            application/json:
              example:
                detail: 'Unsupported Media Type: ''Content-Type'' must be ''application/json''
                  for POST requests.'
        '422':
          description: Validation error (e.g. missing required fields or invalid length)
        '409':
          description: Conflict - A stock with this ISIN or WKN already exists
          content:
            application/json:
              example:
                detail: A stock with this ISIN or WKN already exists.
  /stocks/{stock_id}:
    get:
      tags:
      - Stocks
      summary: Get stock details
      description: Retrieve full stock information by its database ID.
      operationId: get_stock_stocks__stock_id__get
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: Stock details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRead'
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stocks/{stock_id}/sync:
    post:
      tags:
      - Stocks
      summary: Sync market and fundamental data
      description: Fetches recent historical prices and fundamental metrics from the
        active provider.
      operationId: sync_stock_data_stocks__stock_id__sync_post
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: Data synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRead'
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stocks/{stock_id}/prices:
    get:
      tags:
      - Stocks
      summary: Get stock price history
      operationId: get_stock_prices_stocks__stock_id__prices_get
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: List of historical prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockPriceRead'
                title: Response Get Stock Prices Stocks  Stock Id  Prices Get
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stocks/{stock_id}/fundamentals:
    get:
      tags:
      - Stocks
      summary: Get fundamental data periods
      operationId: get_stock_fundamentals_stocks__stock_id__fundamentals_get
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: List of fundamental data periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FundamentalDataRead'
                title: Response Get Stock Fundamentals Stocks  Stock Id  Fundamentals
                  Get
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stocks/{stock_id}/reports:
    get:
      tags:
      - Stocks
      summary: Get company reports
      operationId: get_stock_reports_stocks__stock_id__reports_get
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: List of company reports and analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyReportRead'
                title: Response Get Stock Reports Stocks  Stock Id  Reports Get
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stocks/{stock_id}/analyses:
    get:
      tags:
      - Stocks
      summary: Get historical analyses for stock
      operationId: get_stock_analyses_stocks__stock_id__analyses_get
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      responses:
        '200':
          description: List of versioned analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisResultRead'
                title: Response Get Stock Analyses Stocks  Stock Id  Analyses Get
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portfolios:
    get:
      tags:
      - Portfolios
      summary: List all portfolios
      operationId: list_portfolios_portfolios_get
      responses:
        '200':
          description: List of portfolios
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PortfolioRead'
                type: array
                title: Response List Portfolios Portfolios Get
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
    post:
      tags:
      - Portfolios
      summary: Create a new portfolio
      operationId: create_portfolio_portfolios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
        required: true
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioRead'
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation error (e.g. missing required fields or invalid length)
  /portfolios/{portfolio_id}:
    get:
      tags:
      - Portfolios
      summary: Get portfolio details
      description: Retrieve full portfolio information including current holdings
        and transactions.
      operationId: get_portfolio_portfolios__portfolio_id__get
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioRead'
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Portfolios
      summary: Delete portfolio
      operationId: delete_portfolio_portfolios__portfolio_id__delete
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      responses:
        '200':
          description: Portfolio deleted
          content:
            application/json:
              schema: {}
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portfolios/{portfolio_id}/import/preview:
    post:
      tags:
      - Portfolios
      summary: Preview and validate CSV import
      description: Parses CSV text or file, validates columns and rows, and reports
        errors without modifying the database.
      operationId: preview_csv_import_portfolios__portfolio_id__import_preview_post
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
      responses:
        '200':
          description: CSV Preview and Validation Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportPreviewResponse'
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation error (e.g. missing required fields or invalid length)
  /portfolios/{portfolio_id}/import:
    post:
      tags:
      - Portfolios
      summary: Execute CSV import
      description: Imports verified holdings snapshot or transaction history into
        the specified portfolio.
      operationId: execute_csv_import_portfolios__portfolio_id__import_post
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
      responses:
        '200':
          description: CSV Import Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResultResponse'
        '400':
          description: CSV format error
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation error (e.g. missing required fields or invalid length)
  /portfolios/{portfolio_id}/analyses:
    get:
      tags:
      - Portfolios
      summary: Get portfolio analyses history
      operationId: get_portfolio_analyses_portfolios__portfolio_id__analyses_get
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      responses:
        '200':
          description: List of portfolio analysis results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisResultRead'
                title: Response Get Portfolio Analyses Portfolios  Portfolio Id  Analyses
                  Get
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/stocks/{stock_id}:
    post:
      tags:
      - Analyses
      summary: Trigger stock fundamental analysis
      description: Starts a comprehensive fundamental analysis for a single stock.
        Returns the job status.
      operationId: analyze_stock_analyses_stocks__stock_id__post
      parameters:
      - name: stock_id
        in: path
        required: true
        schema:
          type: integer
          title: Stock Id
      - name: sync
        in: query
        required: false
        schema:
          type: boolean
          description: Execute synchronously and return completed status
          default: true
          title: Sync
        description: Execute synchronously and return completed status
      responses:
        '202':
          description: Analysis job accepted / completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobRead'
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/portfolios/{portfolio_id}:
    post:
      tags:
      - Analyses
      summary: Trigger portfolio analysis
      description: Starts an overall portfolio research analysis covering holdings,
        diversification, fundamentals, and risks.
      operationId: analyze_portfolio_analyses_portfolios__portfolio_id__post
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: integer
          title: Portfolio Id
      - name: sync
        in: query
        required: false
        schema:
          type: boolean
          description: Execute synchronously and return completed status
          default: true
          title: Sync
        description: Execute synchronously and return completed status
      responses:
        '202':
          description: Portfolio analysis job accepted / completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobRead'
        '404':
          description: Portfolio not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/jobs/{job_id}:
    get:
      tags:
      - Analyses
      summary: Get analysis job status
      operationId: get_job_status_analyses_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Job details and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobRead'
        '404':
          description: Job not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyses/results/{result_id}:
    get:
      tags:
      - Analyses
      summary: Get analysis result details
      description: Retrieve versioned analysis result including scores, evaluation,
        metrics, risks, and data gaps.
      operationId: get_analysis_result_analyses_results__result_id__get
      parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: integer
          title: Result Id
      responses:
        '200':
          description: Analysis result details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultRead'
        '404':
          description: Result not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports:
    post:
      tags:
      - Reports
      summary: Add and optionally analyze a company report
      description: Stores quarterly or annual company report text and automatically
        extracts KPIs, statements, risks, and trends.
      operationId: create_report_reports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyReportCreate'
        required: true
      responses:
        '201':
          description: Report stored and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyReportRead'
        '404':
          description: Stock not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation error (e.g. missing required fields or invalid length)
  /reports/{report_id}:
    get:
      tags:
      - Reports
      summary: Get report and its analyses
      operationId: get_report_reports__report_id__get
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyReportRead'
        '404':
          description: Report not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/{report_id}/analyze:
    post:
      tags:
      - Reports
      summary: Run or re-run analysis on an existing report
      operationId: analyze_existing_report_reports__report_id__analyze_post
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      responses:
        '200':
          description: Report analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAnalysisRead'
        '404':
          description: Report not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/analyses/{analysis_id}/verify:
    patch:
      tags:
      - Reports
      summary: Verify extracted report figures
      description: Updates verification status of extracted report data from unverified
        to verified.
      operationId: verify_analysis_reports_analyses__analysis_id__verify_patch
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: integer
          title: Analysis Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportVerificationUpdate'
      responses:
        '200':
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAnalysisRead'
        '404':
          description: Analysis not found
        '401':
          description: Unauthorized - Missing or invalid X-API-KEY header
          content:
            application/json:
              example:
                detail: Invalid or missing X-API-KEY header.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisJobRead:
      properties:
        id:
          type: integer
          title: Id
        job_type:
          type: string
          title: Job Type
        stock_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stock Id
        portfolio_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Portfolio Id
        status:
          type: string
          title: Status
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Params
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - job_type
      - status
      title: AnalysisJobRead
    AnalysisResultRead:
      properties:
        id:
          type: integer
          title: Id
        job_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Job Id
        stock_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stock Id
        portfolio_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Portfolio Id
        version:
          type: integer
          title: Version
        analysis_type:
          type: string
          title: Analysis Type
        headline:
          anyOf:
          - type: string
          - type: 'null'
          title: Headline
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        details:
          additionalProperties: true
          type: object
          title: Details
        data_gaps:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Data Gaps
        uncertainties:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Uncertainties
        data_sources:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Data Sources
        data_timestamp:
