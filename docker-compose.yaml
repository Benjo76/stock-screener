
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockagent}
      POSTGRES_USER: ${POSTGRES_USER:-stockagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-stockagent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stockagent}"
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    init: true

  screener:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - jobs
    command: ["python", "-m", "screener.worker"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-stockagent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stockagent}"
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    init: true
    restart: "no"

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
